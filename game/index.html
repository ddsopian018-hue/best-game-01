<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nebula Harvest</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b1e; }
  #game {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Nebula Harvest: pilot a harvest drone with WASD or arrow keys, dash with Shift or Space, and click to fire a pulse that bursts void mites. Collect star-seeds to fill each level quota and clear level 5 to win."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
